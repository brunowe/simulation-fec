<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive numerical experiments across science and engineering by Bruno Weber."
    />
    <meta name="theme-color" content="#12100f" />
    <meta name="color-scheme" content="light dark" />
    <meta name="author" content="Bruno Weber" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bruno Weber - Simulation Lab" />
    <meta property="og:title" content="Bruno Weber - Simulation Lab" />
    <meta
      property="og:description"
      content="Interactive numerical experiments across science and engineering."
    />
    <meta property="og:url" content="https://brunoweber.dev/" />
    <meta
      property="og:image"
      content="https://brunoweber.dev/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bruno Weber Simulation Lab social preview" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bruno Weber - Simulation Lab" />
    <meta
      name="twitter:description"
      content="Interactive numerical experiments across science and engineering."
    />
    <meta
      name="twitter:image"
      content="https://brunoweber.dev/og.png"
    />
    <link rel="canonical" href="https://brunoweber.dev/" />
    <link rel="icon" href="/favicon-bw.svg" sizes="any" type="image/svg+xml" />
    <title>Bruno Weber - Simulation Lab</title>
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem("simulation-lab-theme");
          const theme =
            storedTheme === "light" || storedTheme === "dark" ? storedTheme : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", theme === "dark" ? "#12100f" : "#f5efe5");
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", "#12100f");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
